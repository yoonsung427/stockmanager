[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmanager"
version = "0.1.0"
description = "Semi-autonomous mock portfolio manager (no real money, no brokerage)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "aiohttp",
    "httpx",
    "discord.py",
    "psutil",
    "anthropic",
    "jinja2",
    "defusedxml",
    "yfinance>=0.2.0",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-psutil",
    "types-defusedxml",
    "uvicorn",
]

[project.scripts]
stockmanager = "stockmanager.cli:main"

[project.urls]
Repository = "https://github.com/yoonsung/stockmanager"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockmanager = ["prompts/**/*", "dashboard/templates/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/sim and tests/integration keep the TS-spec file names (fault_injection.py, ...), so collect them by directory.
python_files = ["test_*.py", "tests/sim/*.py", "tests/integration/*.py"]
